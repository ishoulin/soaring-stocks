name: ZenMomentum Daily Scanner

on:
  schedule:
    # 台灣時間週一至週五 17:18 (UTC 09:18) 盤後執行
    - cron: '18 9 * * 1-5'
  workflow_dispatch: # 保留網頁手動觸發按鈕

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests yfinance lxml html5lib

    # 修復 1：統一狀態檔名為 zen_state.json，並優化快取 Key 邏輯
    - name: Restore arena state
      uses: actions/cache@v3
      with:
        path: zen_state.json
        key: zen-state-v1-${{ github.sha }}
        restore-keys: |
          zen-state-v1-

    # 修復 2：加上 timeout-minutes: 10，避免 yfinance 連線死鎖無限轉圈
    - name: Run ZenMomentum Scanner
      timeout-minutes: 30
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: python main.py

    # 修復 3：統一保存 zen_state.json 快取
    - name: Save arena state
      if: always() # 確保就算程式結束也能更新快取
      uses: actions/cache@v3
      with:
        path: zen_state.json
        key: zen-state-v1-${{ github.sha }}

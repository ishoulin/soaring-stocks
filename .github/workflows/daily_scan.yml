name: ZenMomentum Daily Scanner

on:
  schedule:
    # 台灣時間 14:30 (UTC 06:30)，週一至週五
    - cron: '30 6 * * 1-5'
  workflow_dispatch: # 允許手動點擊按鈕測試

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests yfinance lxml html5lib

    - name: Restore arena state
      uses: actions/cache@v3
      with:
        path: arena_state.json
        key: arena-state-${{ github.run_id }}
        restore-keys: |
          arena-state-

    - name: Run ZenMomentum Scanner
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: python main.py

    - name: Save arena state
      uses: actions/cache@v3
      with:
        path: arena_state.json
        key: arena-state-${{ github.run_id }}
